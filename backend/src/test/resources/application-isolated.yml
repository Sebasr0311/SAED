# Load this file explicitly via spring.config.location. It never imports .env.
# The guarded runner supplies datasource credentials and a generated JWT secret.
spring:
  application:
    name: saed-isolated-verification
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:oracle:thin:@//127.0.0.1:11521/XEPDB1
    username: SAED_ISO_RUNTIME
    password: ${SAED_ISOLATED_RUNTIME_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 10000
      initialization-fail-timeout: 10000
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=SAED_ISO_OWNER
  mail:
    host: 127.0.0.1
    port: 2525
server:
  port: 0
jwt:
  secret: ${SAED_ISOLATED_JWT_SECRET}
  expiration:
    ms: 300000
saed:
  cors:
    # Local browser verification only (Vite dev server proxying to this backend).
    allowed-origins: http://127.0.0.1:5199
  database:
    maintenance:
      enabled: false
    demo-seeding:
      enabled: false
