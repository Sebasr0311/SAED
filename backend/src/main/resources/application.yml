server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: saed-backend
  profiles:
    # No development fallback: an unset SPRING_PROFILES_ACTIVE runs as prod and must be fully configured.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

# Secrets and origins have no fallback outside the dev profile. ProductionConfigurationGuard refuses
# to start a production-like profile when any of them is missing or uses a repository-published value.
saed:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  wompi:
    # SANDBOX or LIVE, declared explicitly; key prefixes must match the declared environment.
    environment: ${WOMPI_ENVIRONMENT:}
    public-key: ${WOMPI_PUBLIC_KEY:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    events-secret: ${WOMPI_EVENTS_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: 20000
      leak-detection-threshold: 60000

jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: 86400000

# Development-only fallbacks: local frontend origins and the sandbox environment label. Credentials
# (JWT_SECRET, DB_*, WOMPI_*) have NO fallback in any profile: supply them through the environment or
# an untracked .env file (see backend/.env.example).
saed:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  wompi:
    environment: ${WOMPI_ENVIRONMENT:SANDBOX}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: 20000
      # 60s threshold avoids false-positive leak warnings on Oracle ATP (Render -> cloud latency)
      leak-detection-threshold: 60000


# CORS_ALLOWED_ORIGINS and WOMPI_* use the empty base defaults above; ProductionConfigurationGuard
# rejects them when missing, so the failure message lists every missing variable at once.
jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: 86400000
