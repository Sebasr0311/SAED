services:
  - type: web
    name: saed-backend
    rootDir: backend
    runtime: java
    region: oregon
    plan: free
    env: java
    buildCommand: mvn clean package -DskipTests -q
    startCommand: java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar target/backend-1.0.0-SNAPSHOT.jar
    healthCheckPath: /api/v1/auth/login
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  - type: web
    name: saed-frontend
    rootDir: frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html