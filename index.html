<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/imagenes/saed_logo_emblem_only.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAED — Sistema de Administración Residencial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restaura la ruta SPA guardada por public/404.html (GitHub Pages no
      // reescribe a index.html en rutas profundas). Solo actua si hay clave.
      (function () {
        try {
          var saved = sessionStorage.getItem('saed_spa_redirect');
          if (saved && saved.indexOf('/sistema-administracion-edificios/') === 0) {
            sessionStorage.removeItem('saed_spa_redirect');
            history.replaceState(null, '', saved);
          }
        } catch (e) {
          /* storage no disponible: no-op */
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script type="module" src="/client/main.jsx"></script>
  </body>
</html>
