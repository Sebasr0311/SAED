name: CI - SAED 2.0
on:
  push:
    branches: ['**']
  pull_request:

# Test tiers are selected by com.saed.backend.testsupport.TestTierFilter (backend/src/test):
#   unit     = every test class that is not a @SpringBootTest and not @Tag("database")
#              (Mockito, WebMvc slices, source guards). New classes are picked up automatically.
#   database = every @SpringBootTest / @Tag("database") class; needs an Oracle schema.
# The database tier never reports success without running: it is skipped (not passed) unless the
# repository variable SAED_ORACLE_CI is 'true', and then it fails if the secrets are missing.

jobs:
  backend:
    name: Backend build, Checkstyle and unit/security tier (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn -B compile -q

      - name: Run Checkstyle Quality Gate
        working-directory: backend
        run: mvn -B checkstyle:check -q

      - name: Run unit and web-security tier
        working-directory: backend
        # Unroutable datasource: a unit-tier test that tries to reach a database fails instead of
        # silently using a developer default.
        env:
          DB_URL: jdbc:oracle:thin:@127.0.0.1:1/unit-tier-has-no-database
        run: mvn -B test -Dsaed.test.tier=unit

      - name: Unit tier summary
        if: always()
        working-directory: backend
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No surefire reports were produced; the unit tier did not run."
            exit 1
          fi
          echo "Unit tier: ${#reports[@]} test classes executed." >> "$GITHUB_STEP_SUMMARY"

  backend-database:
    name: Backend database tier (Oracle; skipped unless SAED_ORACLE_CI is enabled)
    if: ${{ vars.SAED_ORACLE_CI == 'true' }}
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # Classes without @ActiveProfiles use the test profile instead of the prod default.
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v5

      - name: Require database secrets
        run: |
          missing=0
          for v in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is not configured"; missing=1; fi
          done
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run database tier
        working-directory: backend
        run: mvn -B test -Dsaed.test.tier=database

  dependency-check:
    name: OWASP dependency check (skipped unless SAED_OWASP_CI is enabled)
    if: ${{ vars.SAED_OWASP_CI == 'true' }}
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Require NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then echo "::error::NVD_API_KEY secret is not configured"; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP dependency check
        working-directory: backend
        run: mvn -B dependency-check:check -DfailBuildOnCVSS=9 -DnvdApiKey="$NVD_API_KEY" -q

  frontend:
    name: Frontend Lint & Build Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint Quality Gate
        working-directory: frontend
        run: pnpm lint

      - name: Production Build Quality Gate
        working-directory: frontend
        run: pnpm build
